[platformio]
default_envs = h752_02_candidate
boards_dir = boards

[env]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    jgromes/RadioLib@6.5.0
    bblanchon/ArduinoJson@7.2.1

; Product/SKU H752-02 (915 MHz + GPS), using the current official Pro
; electrical implementation as a candidate until confirmed on the device.
[env:h752_02_candidate]
build_flags =
    ${env.build_flags}
    -DHQ_PROFILE_CURRENT_PRO=1

; Deliberate comparison build only. This does not claim H752-02 uses the
; legacy H752 wiring and does not invent GPS pins absent from that source.
[env:legacy_h752_comparison]
build_flags =
    ${env.build_flags}
    -DHQ_PROFILE_LEGACY_H752=1
