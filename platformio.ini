[platformio]
default_envs = h752_02_candidate
boards_dir = boards

[env]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    jgromes/RadioLib@6.5.0
    bblanchon/ArduinoJson@7.2.1
    mikalhart/TinyGPSPlus@1.1.0

; Product/SKU H752-02 (915 MHz + GPS), using the current official Pro
; electrical implementation as a candidate until confirmed on the device.
[env:h752_02_candidate]
build_flags =
    ${env.build_flags}
    -DHQ_PROFILE_CURRENT_PRO=1

; Deliberate physical timing-qualification image. This inherits the exact
; H752-02 candidate board flags and only enables privacy-safe PERF records.
[env:h752_02_diagnostics]
build_flags =
    ${env:h752_02_candidate.build_flags}
    -DSUPPORTFORGE_PERF_DIAGNOSTICS=1

; Deliberate comparison build only. This does not claim H752-02 uses the
; legacy H752 wiring and does not invent GPS pins absent from that source.
[env:legacy_h752_comparison]
build_flags =
    ${env.build_flags}
    -DHQ_PROFILE_LEGACY_H752=1

; Compile-only FastEPD API/resource spike. This environment intentionally excludes
; every production source file, including secrets.h, and is never an upload target.
; The retained smoke routine exercises the official LilyGo profile at link time but
; setup() never invokes it, so an accidental boot cannot power or update the panel.
[env:fast_epd_h752_02_compile_only]
build_flags =
    ${env:h752_02_candidate.build_flags}
    -DFAST_EPD_COMPILE_ONLY=1
build_src_filter =
    -<*>
    +<../evaluation/fast_epd_smoke.cpp>
lib_extra_dirs =
    evaluation/lib
lib_deps =
    FastEPD
